name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    strategy:
      matrix:
        # wavpack-numcodecs ships only an sdist that links bundled libwavpack builds for glibc 2.35/2.39;
        # ubuntu-latest (26.04, glibc 2.43) fails to build it. Return to ubuntu-latest once it installs there.
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.13"]

    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.actor != 'github-actions[bot]' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump:'))

    uses: AllenNeuralDynamics/galen-uv-workflows/.github/workflows/ci.yml@v2
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      package-name: aind_ephys_ibl_gui_conversion
      run-mypy: false
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
